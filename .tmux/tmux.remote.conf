# show status bar at the top for remote session
# so it do not stack together with local session's one
set -g status-position top

# Slow status refresh for SSH — every 15s instead of the local 5s
set -g status-interval 15

# Clipboard integration: emit OSC 52 on copy so the sequence propagates up
# through SSH and the outer tmux to the local terminal's clipboard.
# (Redundant with tmux.conf's setting; kept here so the file is self-documenting.)
set -g set-clipboard on

# In remote mode we drop the battery suffix; the shared chunk is defined in tmux.conf.
set -g status-right "$wg_status_base"
