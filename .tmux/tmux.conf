# Set the title of the current window
set-option -g set-titles on

# Setting Ctrl-A as the prefix key
unbind C-b
set -g prefix C-a

# ================================
# === Stuff from tmux-sensible ===
# ================================

# https://github.com/tmux-plugins/tmux-sensible

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# increase scrollback buffer size
set -g history-limit 50000

# tmux messages are displayed for 2 seconds
set -g display-time 2000

# upgrade $TERM and enable truecolor for modern apps (vim, nvim, bat)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# this prevents tmux from starting a login shell each time
# not sure if I need it
#set -g default-command "${SHELL}"

# ====================================
# === End stuff from tmux-sensible ===
# ====================================

# ===============
# ===  Theme  ===
# ===============
# Defined before the widgets below so that $color_* are populated when the
# widget format strings are parsed.

color_purple="colour134" # 135, 134
color_black="black"      # ANSI 0 — remapped by terminal theme (e.g. Solarized base02)
color_white="white" # 015

color_status_text="colour245"
color_dark="$color_black"
color_light="$color_white"
color_secondary="$color_purple"
color_window_off_status_bg="colour238"
color_window_off_indicator="colour088"

# Forward focus events to inner programs (vim :set autoread, etc.)
set -g focus-events on

# Renumber remaining windows after one closes — keeps prefix N shortcuts compact
set -g renumber-windows on

# Size a window to its currently-viewing clients only (nested-tmux / multi-client friendly)
setw -g aggressive-resize on

# Making Tmux more like vim
setw -g mode-keys vi

# Rename your terminals
set -g set-titles on
#set -g set-titles-string '#(whoami)::#h::#(curl ipecho.net/plain;echo)'
set -g set-titles-string '#(whoami)::#h'

# Define widgets that are used in status bar
wg_battery='#{battery_status_fg} #{battery_icon}#{battery_percentage} #{battery_remain}'
#wg_is_zoomed="#[fg=$color_dark,bg=$color_purple]#{?window_zoomed_flag,[Z],}#[default]"
wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"
# Shared chunk of status-right reused by tmux.remote.conf (single source of truth for local + remote).
wg_status_base="#{prefix_highlight} $wg_is_keys_off $wg_is_zoomed #[fg=Cyan][#S] #[fg=white]%a %b %d %H:%M"

# Status bar customization
set -g status-style "fg=$color_light,bg=$color_dark"
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 80
set -g status-justify left
set -g status-left "#[fg=Green]#(whoami)#[fg=white]::#[fg=blue]#h#[fg=white]::| "
set -g status-right "$wg_status_base |$wg_battery"

# Active window title colors
set-window-option -g window-status-current-style "fg=colour166,bg=default"  # orange

# Setting R to resource the config
bind r source-file ~/.tmux.conf\; display "~/.tmux.conf sourced!"

# Tell tmux that Prefix + a should send the prefix key to the program running in 
# the current pane, so we can go to beginning of the line
bind a send-prefix

# Set base index to 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse integration
set -g mouse
bind m set -g mouse off \; display 'Mouse: OFF'
bind M set -g mouse on \; display 'Mouse: ON'

# Clipboard integration: tmux emits OSC 52 on copy → iTerm2 writes to macOS clipboard.
# Requires iTerm2: Settings → General → Selection → "Applications in terminal may access clipboard".
set -g set-clipboard on
# Allow OSC sequences from nested tmux / inner programs to pass through (tmux 3.3+).
# Lets OSC 52 from a remote tmux flow up through this (outer) tmux to iTerm2.
# -q so older tmux silently ignores instead of erroring (we deploy this conf everywhere now).
set -gq allow-passthrough on
# On mouse-drag end, copy the selection and keep it highlighted (defensive — defaults vary by version).
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Vim-style copy-mode keys (mode-keys vi only changes navigation, not selection/copy).
# `v` starts a selection, `V` selects whole lines, Ctrl-v toggles block/rectangle mode,
# `y` yanks and exits — same muscle memory as vim's visual mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Recover from a TUI program (vim, htop, ssh session running TUI tools, etc.) that
# exited with mouse tracking still enabled. Symptom: clicking in the pane types
# "<35;42;15M"-style garbage at the prompt. Writes the disable sequences directly
# to the pane's tty, so the binding is silent — no command typed, no shell history.
bind R run-shell "printf '\\033[?1000l\\033[?1002l\\033[?1003l\\033[?1006l' > #{pane_tty}"

# Set up pane synchronisation mechanism
bind b setw synchronize-panes off \; display 'Sync: OFF'
bind B setw synchronize-panes on \; display 'Sync: ON'

# Rebinding new window to create window with the same dir
#bind c new-window -c '#{pane_current_path}'

# Splits — visually named (| = vertical divider, - = horizontal divider).
# Inherit the current pane's directory.
unbind v
unbind h
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Vim-style pane navigation (consistent with mode-keys vi)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ===============
# === Plugins ===
# ===============
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Shorten the output of #{battery_remain} when discharging to ~H:MM
set -g @batt_remain_short true

# tmux-continuum: auto-save sessions every 15 min, auto-restore on tmux start.
# (Save interval is set explicitly at its default value for documentation.)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# =========================================
# === Nesting local and remote sessions ===
# =========================================

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.tmux/tmux.remote.conf'

# We want to have single prefix key "C-a" for both local and remote session
# The idea is to turn off all key bindings and prefix handling on local sesion,
# so that ll keystrokes are passed to inner/remote session

# Also, change some visual styles when window keys are off
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
    refresh-client -S \;\

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S \;\

# Run all plugins' scripts
run '~/.tmux/plugins/tpm/tpm'
